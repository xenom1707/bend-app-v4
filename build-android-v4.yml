name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Node and NPM
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Check required files
        shell: powershell
        run: |
          if (!(Test-Path "package.json")) {
              Write-Error "ERROR: package.json was not found"
              exit 1
          }

          if (!(Test-Path "main.js")) {
              Write-Error "ERROR: main.js was not found"
              exit 1
          }

          if (!(Test-Path "index.html")) {
              Write-Error "ERROR: index.html was not found"
              exit 1
          }

          Write-Host "All required files found."

      - name: Install dependencies
        shell: powershell
        run: |
          npm install

      - name: Build Windows EXE
        shell: powershell
        run: |
          npm run dist

      - name: Check EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist")) {
              Write-Error "ERROR: dist folder was not created"
              exit 1
          }

          $exeFiles = Get-ChildItem "dist" -Filter "*.exe" -File

          if ($exeFiles.Count -eq 0) {
              Write-Error "ERROR: EXE was not created"
              exit 1
          }

          Write-Host "EXE created successfully:"
          $exeFiles | ForEach-Object {
              Write-Host $_.FullName
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BendCalculator-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
