<div class="card"><h1>מחשבון כיפוף + מאגר ניסויים V3</h1><div class="muted">מאגר מקורי + נתונים שאתה מוסיף. הנתונים האישיים נשמרים מקומית במכשיר.</div></div>

<div class="card calc"><h2>Reverse – מציאת BD מחלק קיים</h2><div class="grid"><div><label>חומר</label><select id="revMat"></select></div><div><label>עובי T</label><select id="revT"></select></div><div><label>רדיוס R</label><select id="revR"></select></div><div><label>זווית</label><select id="revA"></select></div><div><label>מספר כיפופים</label><input id="revCount" type="number" min="1" value="1"></div><div><label>פריסה קיימת</label><input id="revFlat" inputmode="decimal"></div><div><label>סכום מידות חיצוניות</label><input id="revOutside" inputmode="decimal"></div></div><div class="actions"><button onclick="reverseLookup()">חשב והשווה למאגר</button></div><div id="reverseResult" class="result" style="margin-top:10px"></div><div id="reverseRows"></div></div>
<div class="card no-print"><h2>הוסף / ערוך ניסוי</h2><input type="hidden" id="editId"><div class="grid"><div><label>חומר</label><select id="aMat"><option value="Steel">ברזל</option><option value="Stainless">נירוסטה</option><option value="Aluminum">אלומיניום</option><option value="Nichrome">ניכרום</option></select></div><div><label>עובי T</label><input id="aT" inputmode="decimal"></div><div><label>זווית °</label><input id="aA" inputmode="decimal" value="90"></div><div><label>רדיוס R</label><input id="aR" inputmode="decimal"></div><div><label>פריזמה V</label><input id="aV" inputmode="decimal"></div><div><label>BD</label><input id="aBD" inputmode="decimal"></div><div><label>תאריך</label><input id="aDate" type="date"></div><div><label>הערה</label><input id="aNote"></div></div><div class="actions"><button onclick="saveRecord()">שמור במאגר</button><button class="alt" onclick="clearForm()">נקה</button></div><div id="saveMsg" class="muted"></div></div>

const KEY="bend_user_records_v3"; const OLDKEY="bend_user_records_v2"; const NAMES={Steel:"ברזל",Stainless:"נירוסטה",Aluminum:"אלומיניום",Nichrome:"ניכרום"}; let selected=null; const $=id=>document.getElementById(id); const num=v=>parseFloat(String(v).replace(",","."));
function baseRecords(){return BASE_DATA.map((x,i)=>({id:"B"+(i+1),material:x[0],t:x[1],v:x[2],r:x[3],bd:x[4],note:x[5]||"",angle:90,source:"מקורי",date:""}))}
function users(){try{let s=localStorage.getItem(KEY);if(!s){s=localStorage.getItem(OLDKEY);if(s)localStorage.setItem(KEY,s)}return JSON.parse(s||"[]")}catch(e){return[]}}
function saveUsers(a){localStorage.setItem(KEY,JSON.stringify(a))} function all(){return baseRecords().concat(users())} function uniq(a){return [...new Set(a)].sort((a,b)=>(typeof a==="number"&&typeof b==="number")?a-b:String(a).localeCompare(String(b)))}
function opts(id,a,label=x=>x){let e=$(id);e.innerHTML="";a.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=label(v);e.appendChild(o)})}
function filterSet(prefix){let A=all(),m=$(prefix+"Mat").value,t=num($(prefix+"T").value),r=num($(prefix+"R").value);return A.filter(x=>x.material===m&&x.t===t&&x.r===r)}
function initCalc(){let A=all();opts("mat",uniq(A.map(x=>x.material)),x=>NAMES[x]||x);$("mat").onchange=refreshT;$("th").onchange=refreshR;$("rad").onchange=refreshA;refreshT()}
function refreshT(){let A=all(),m=$("mat").value;opts("th",uniq(A.filter(x=>x.material===m).map(x=>x.t)),x=>x+" מ״מ");refreshR()}function refreshR(){let A=all(),m=$("mat").value,t=num($("th").value);opts("rad",uniq(A.filter(x=>x.material===m&&x.t===t).map(x=>x.r)),x=>"R"+x);refreshA()}function refreshA(){let A=all(),m=$("mat").value,t=num($("th").value),r=num($("rad").value);opts("ang",uniq(A.filter(x=>x.material===m&&x.t===t&&x.r===r).map(x=>x.angle)),x=>x+"°")}
function initReverse(){let A=all();opts("revMat",uniq(A.map(x=>x.material)),x=>NAMES[x]||x);$("revMat").onchange=revT;$("revT").onchange=revR;$("revR").onchange=revA;revT()}function revT(){let A=all(),m=$("revMat").value;opts("revT",uniq(A.filter(x=>x.material===m).map(x=>x.t)));revR()}function revR(){let A=all(),m=$("revMat").value,t=num($("revT").value);opts("revR",uniq(A.filter(x=>x.material===m&&x.t===t).map(x=>x.r)),x=>"R"+x);revA()}function revA(){let s=filterSet("rev");opts("revA",uniq(s.map(x=>x.angle)),x=>x+"°")}
function rowsTable(rows){if(!rows.length)return "";return '<div class="scroll"><table><thead><tr><th>V</th><th>R</th><th>Angle</th><th>BD</th><th>Source</th><th>Note</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${x.v}</td><td>${x.r}</td><td>${x.angle}°</td><td><b>${x.bd}</b></td><td>${x.source}</td><td>${esc(x.note||"")}</td></tr>`).join("")+'</tbody></table></div>'}
function lookup(){let m=$("mat").value,t=num($("th").value),r=num($("rad").value),a=num($("ang").value);let rows=all().filter(x=>x.material===m&&x.t===t&&x.r===r&&x.angle===a).sort((x,y)=>x.v-y.v||x.bd-y.bd);if(!rows.length){$("answerText").textContent="לא נמצאה התאמה.";$("matchRows").innerHTML="";$("flatBox").className="hide";selected=null;return}selected=rows[0];$("answerText").textContent=`נמצאו ${rows.length} רשומות. נבחרה הראשונה: V${selected.v} | R${selected.r} | ${selected.angle}° | BD ${selected.bd} מ״מ`;$("matchRows").innerHTML=rowsTable(rows);$("flatBox").className=""}
function flatCalc(){if(!selected)return;let total=num($("total").value),c=parseInt($("count").value);if(!Number.isFinite(total)||!c){$("flatResult").textContent="נא להזין נתונים תקינים";return}let d=selected.bd*c;$("flatResult").textContent=`סה״כ הפחתה: ${d.toFixed(3)} מ״מ\nפריסה: ${(total-d).toFixed(3)} מ״מ`}
function reverseLookup(){let c=parseInt($("revCount").value),flat=num($("revFlat").value),out=num($("revOutside").value);if(!c||!Number.isFinite(flat)||!Number.isFinite(out)){$("reverseResult").textContent="נא להזין מספר כיפופים, פריסה וסכום מידות.";return}let bd=(out-flat)/c,m=$("revMat").value,t=num($("revT").value),r=num($("revR").value),a=num($("revA").value);let rows=all().filter(x=>x.material===m&&x.t===t&&x.r===r&&x.angle===a).sort((x,y)=>Math.abs(x.bd-bd)-Math.abs(y.bd-bd));let best=rows[0];$("reverseResult").textContent=`BD נמדד: ${bd.toFixed(3)} מ״מ`+(best?`\nהכי קרוב במאגר: V${best.v} | BD ${best.bd} | הפרש ${Math.abs(best.bd-bd).toFixed(3)} מ״מ`:"\nאין התאמות במאגר");$("reverseRows").innerHTML=rowsTable(rows)}
function saveRecord(){let rec={id:$("editId").value||("U"+Date.now()),material:$("aMat").value,t:num($("aT").value),angle:num($("aA").value),r:num($("aR").value),v:num($("aV").value),bd:num($("aBD").value),note:$("aNote").value.trim(),date:$("aDate").value,source:"ניסוי"};if([rec.t,rec.angle,rec.r,rec.v,rec.bd].some(x=>!Number.isFinite(x))){$("saveMsg").textContent="יש למלא T, זווית, R, V ו-BD במספרים תקינים.";return}let u=users(),i=u.findIndex(x=>x.id===rec.id);if(i>=0)u[i]=rec;else u.push(rec);saveUsers(u);$("saveMsg").textContent="הנתון נשמר.";clearForm(false);initAll()}
function clearForm(msg=true){$("editId").value="";["aT","aR","aV","aBD","aNote"].forEach(id=>$(id).value="");$("aA").value="90";$("aDate").value=new Date().toISOString().slice(0,10);if(msg)$("saveMsg").textContent=""}
function editRec(id){let x=users().find(r=>r.id===id);if(!x)return;$("editId").value=x.id;$("aMat").value=x.material;$("aT").value=x.t;$("aA").value=x.angle;$("aR").value=x.r;$("aV").value=x.v;$("aBD").value=x.bd;$("aNote").value=x.note||"";$("aDate").value=x.date||"";window.scrollTo({top:document.body.scrollHeight/2,behavior:"smooth"})}
function delRec(id){if(confirm("למחוק את הרשומה?")){saveUsers(users().filter(x=>x.id!==id));initAll()}}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function renderDB(){let A=all(),tb=$("dbRows");tb.innerHTML=A.map(x=>`<tr class="${x.source==="ניסוי"?"userrow":""}"><td>${x.id}</td><td>${NAMES[x.material]||x.material}</td><td>${x.t}</td><td>${x.angle}°</td><td>${x.v}</td><td>${x.r}</td><td><b>${x.bd}</b></td><td>${x.source}</td><td>${x.date||""}</td><td>${esc(x.note||"")}</td><td class="no-print">${x.source==="ניסוי"?`<button onclick="editRec('${x.id}')">ערוך</button> <button class="danger" onclick="delRec('${x.id}')">מחק</button>`:"—"}</td></tr>`).join("");$("dbCount").textContent=`סה״כ ${A.length} רשומות | ניסויים שלך: ${users().length}`}
function printDB(){window.print()}
function csvText(){let R=[["ID","Material","Thickness_mm","Angle_deg","V_mm","R_mm","BD_mm","Source","Date","Note"]];all().forEach(x=>R.push([x.id,NAMES[x.material]||x.material,x.t,x.angle,x.v,x.r,x.bd,x.source,x.date||"",x.note||""]));return R.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n")}
function download(name,type,text){let b=new Blob([text],{type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){download("bend_database.csv","text/csv;charset=utf-8","\ufeff"+csvText())} function exportBackup(){download("bend_database_backup.json","application/json;charset=utf-8",JSON.stringify(users(),null,2))}

function chooseBackupFile(){
  if (window.Android && typeof Android.openJsonFile === "function") {
    Android.openJsonFile();
  } else {
    document.getElementById("importFile").click();
  }
}

function importBackupText(text){
  try{
    const a = JSON.parse(text);
    if(!Array.isArray(a)) throw Error();
    if(confirm(`לשחזר ${a.length} רשומות?`)){
      saveUsers(a);
      initAll();
      alert("השחזור הושלם.");
    }
  }catch(e){
    alert("קובץ גיבוי לא תקין");
  }
}

function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let a=JSON.parse(r.result);if(!Array.isArray(a))throw Error();if(confirm(`לשחזר ${a.length} רשומות?`)){saveUsers(a);initAll()}}catch(_){alert("קובץ גיבוי לא תקין")}};r.readAsText(f);e.target.value=""}
function initAll(){initCalc();initReverse();renderDB();if(!$("aDate").value)$("aDate").value=new Date().toISOString().slice(0,10)} document.addEventListener("DOMContentLoaded",initAll);
</script></body></html>
